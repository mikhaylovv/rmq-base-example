services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  publisher:
    build:
      context: .
      target: publisher
    network_mode: "service:rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  publisher-confirms:
    profiles: ["confirms"]
    build:
      context: .
      target: publisher-confirms
    network_mode: "service:rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 15s

  consumer:
    build:
      context: .
      target: consumer
    network_mode: "service:rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  rabbitmq-data:
